<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="La Casa Demir — Restaurant à Faulquemont">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f7"/>
    </linearGradient>
    <linearGradient id="marque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b23c17"/>
      <stop offset="1" stop-color="#8d2f10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b23c17" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#b23c17" stop-opacity="0"/>
    </radialGradient>
    <style>
      .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
      .t{font-family:ui-serif,Georgia,"Times New Roman",serif}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#fond)"/>
  <circle cx="1065" cy="105" r="330" fill="url(#halo)"/>
  <circle cx="135" cy="590" r="250" fill="url(#halo)"/>

  <rect x="80" y="78" width="88" height="88" rx="22" fill="url(#marque)"/>
  <text x="124" y="124" text-anchor="middle" dominant-baseline="central" class="s"
        font-size="36" font-weight="800" fill="#ffffff">CD</text>

  <text x="190" y="110" class="s" font-size="25" font-weight="700" fill="#10151f">La Casa Demir</text>
  <text x="190" y="146" class="s" font-size="20" font-weight="500" fill="#5a6678">Restaurant · Faulquemont</text>

  <text x="80" y="300" class="t" font-size="62" font-weight="600" fill="#10151f">La carte</text>
  <text x="80" y="372" class="t" font-size="62" font-weight="600" fill="#b23c17">Faulquemont</text>

  <rect x="80" y="430" width="640" height="2" fill="#10151f" opacity="0.1"/>
  <text x="80" y="486" class="s" font-size="23" font-weight="500" fill="#2d3747">Ce que nous servons · Restaurant</text>

  <rect x="80" y="520" width="310" height="58" rx="29" fill="url(#marque)"/>
  <text x="235" y="550" text-anchor="middle" dominant-baseline="central" class="s"
        font-size="21" font-weight="700" fill="#ffffff">Réserver une table</text>
</svg>
